<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030303">
<meta name="description" content="Solace State. An uninterrupted first-person ASCII walk through a quiet, rain-soaked Japanese street.">
<title>Solace State</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='black'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='42' fill='white'%3E%23%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><main id="game" aria-label="Solace State, a quiet walking game">
<canvas id="world" tabindex="0" aria-label="ASCII Japanese street. WASD walks. Drag or arrow keys look around. Escape opens the menu. On touchscreens, drag the left half to move and the right half to look; tap with two fingers for the menu."></canvas>
<div id="loading" role="status">Preparing the street?</div>
<div class="glass fatal-error" id="fatal-error" hidden><h1>A little trouble starting.</h1><p id="fatal-message"></p><button onclick="location.reload()">Try again</button></div>
</main>
<dialog id="menu" class="glass" aria-labelledby="menu-title">
<h1 id="menu-title">Solace State</h1>
<p class="desktop-help">WASD to walk. Drag or use the arrow keys to look.<br>Escape brings you back here.</p>
<p class="touch-help">Left thumb to walk. Right thumb to look.<br>Tap with two fingers to open this menu.</p>
<button id="begin" class="primary" disabled>Preparing the street?</button>
<div class="settings"><button id="sound" aria-pressed="false">Rain audio <span>Off</span></button><button id="quality" aria-label="Change ASCII density">Text detail <span>Fine</span></button></div>
<button id="restart" hidden>Start a fresh walk</button>
</dialog>
<noscript>Enable JavaScript to walk through this ASCII world.</noscript></body></html>
